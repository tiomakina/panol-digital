services:
  # Base de datos PostgreSQL 16
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: panol_db
      POSTGRES_USER: panol
      POSTGRES_PASSWORD: ${DB_PASSWORD:-panol123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Puerto NO expuesto al exterior: el backend lo alcanza por la red interna
    # de Docker ("db:5432"). Exponerlo a 0.0.0.0 permite ataques de fuerza
    # bruta directos a la base de datos desde internet.
    expose:
      - "5432"
    healthcheck:
      # Se agrega -d panol_db: sin esa bandera pg_isready intenta conectarse
      # a una BD con el mismo nombre del usuario ("panol"), que no existe —
      # genera FATAL en los logs de Postgres aunque no bloquee el arranque.
      test: ["CMD-SHELL", "pg_isready -U panol -d panol_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - panol-net

  # Redis para cache y Celery
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Puerto NO expuesto al exterior: solo backend y Celery lo necesitan
    # internamente. Redis sin autenticación expuesto a internet es una
    # vulnerabilidad crítica (escritura arbitraria en caché/sesiones).
    expose:
      - "6379"
    networks:
      - panol-net

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-cambiar_en_produccion}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt_cambiar_en_produccion}
      DEBUG: ${DEBUG:-false}
      # Notificaciones por email (Resend u otro SMTP)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # WhatsApp vía Meta Business API (legacy)
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      # WhatsApp vía WAHA (self-hosted — recomendado)
      # Puerto 3000 es el default de WAHA. La key debe coincidir con
      # WHATSAPP_API_KEY del contenedor evolution-api.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:3000}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-panol360-waha-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-panol360}
      # Entorno: "demo" muestra badge naranja en la UI; "prod" no muestra nada.
      # Cambiar a PANOL_ENV=prod en el .env del servidor de producción.
      PANOL_ENV: ${PANOL_ENV:-demo}
      # Token compartido con el admin-panel para endpoints de administración internos.
      # Generar con: openssl rand -hex 32
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:-cambiar_con_openssl_rand_hex_32}
    volumes:
      - ./backend/app/static/uploads:/app/app/static/uploads
      # Respaldos generados/restaurados desde la web (Administración →
      # Respaldo) — quedan visibles en el host, no solo dentro del
      # contenedor, igual que scripts/backup.sh.
      - ./backups:/app/backups
      # tenants.json montado como volumen: git pull en el host actualiza los
      # clientes en tiempo real sin reconstruir la imagen Docker.
      - ./backend/app/tenants.json:/app/app/tenants.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Puerto 8000 solo accesible desde la red interna Docker.
    # Nginx hace de proxy; no hay razón para exponerlo a internet.
    expose:
      - "8000"
    networks:
      - panol-net

  # Celery worker para tareas asíncronas
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:3000}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-panol360-waha-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-panol360}
    depends_on:
      - db
      - redis
      - backend
    networks:
      - panol-net

  # Celery beat — dispara las tareas periódicas (ver beat_schedule en celery_app.py)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:3000}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-panol360-waha-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-panol360}
    depends_on:
      - db
      - redis
      - celery_worker
    networks:
      - panol-net

  # WAHA (WhatsApp HTTP API) — WhatsApp self-hosted via WhatsApp Web
  # Imagen pública, sin cuenta Meta. El Jefe escanea un QR con su celular
  # desde Notificaciones → WhatsApp para conectar la sesión.
  # Docs: https://waha.devlike.pro
  evolution-api:
    image: devlikeapro/waha
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      WHATSAPP_API_KEY: ${EVOLUTION_API_KEY:-panol360-waha-key}
    volumes:
      - evolution_data:/app/.sessions
    networks:
      - panol-net

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/app/static:/var/www/static:ro
      # Certificados SSL de Let's Encrypt (se llenan con certbot en el host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot para renovación automática de certificados
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - panol-net

  # Admin Panel — consola de administración de clientes SaaS
  # Acceso exclusivamente vía Tailscale VPN (100.x.x.x:9001)
  # Puerto 9001 NO está en la Security List de Oracle Cloud → inaccesible desde internet
  admin-panel:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Credenciales — definir en .env del host
      ADMIN_USERNAME: ${ADMIN_PANEL_USER:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PANEL_PASSWORD_HASH}
      SECRET_KEY: ${ADMIN_PANEL_SECRET:-cambiar_con_openssl_rand_hex_32}
      CLIENTS_DIR: /app/clients
      # Ruta al tenants.json montado via volumen (rw para poder agregar/suspender tenants)
      TENANTS_FILE: /app/tenants.json
      # URL interna del backend (red Docker por defecto — sin exponer puertos)
      BACKEND_URL: http://backend:8000
      # Token compartido con el backend para endpoints de admin internos.
      # Generar con: openssl rand -hex 32
      ADMIN_API_SECRET: ${ADMIN_API_SECRET:-cambiar_con_openssl_rand_hex_32}
    volumes:
      # Acceso de lectura/escritura a la carpeta de clientes
      - ./clients:/app/clients:rw
      # tenants.json: admin-panel puede leer/escribir (gestión de tenants);
      # el backend lo monta :ro. Ambos ven el mismo archivo del host.
      - ./backend/app/tenants.json:/app/tenants.json:rw
    ports:
      # Vinculado a todas las interfaces del host.
      # La seguridad la provee:
      #  1. Oracle Cloud Security List (puerto 9001 cerrado al exterior)
      #  2. UFW: sudo ufw allow from 100.64.0.0/10 to any port 9001 (Tailscale CGNAT)
      #  3. Autenticación propia del panel (usuario + contraseña bcrypt)
      - "9001:9001"
    # Necesita acceso al backend para estadísticas y provisionamiento de usuarios
    depends_on:
      - backend
    networks:
      - panol-net

  # Portainer — administración visual de Docker (para usuarios sin conocimientos técnicos)
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    # --no-setup-token: deshabilita el token de configuración inicial.
    # Solo recomendado en redes privadas controladas (que es nuestro caso:
    # el puerto 9000 solo es accesible vía túnel SSH desde localhost).
    command: --no-setup-token
    ports:
      # Solo accesible desde localhost: para usar Portainer hay que abrir
      # un túnel SSH primero (ssh -L 9000:localhost:9000 ubuntu@servidor).
      # Exponerlo a 0.0.0.0 sin HTTPS es un panel de control sin protección.
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  redis_data:
  portainer_data:
  evolution_data:   # Sesiones de WhatsApp Web (Evolution API)

# Red interna explícita — todos los servicios que necesitan comunicarse
# entre sí (backend ↔ admin-panel, backend ↔ celery, etc.) deben declarar
# esta red. Nginx y Portainer la heredan implícitamente por Docker Compose.
networks:
  panol-net:
    driver: bridge
