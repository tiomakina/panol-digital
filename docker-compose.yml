version: '3.9'

services:
  # Base de datos PostgreSQL 16
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: panol_db
      POSTGRES_USER: panol
      POSTGRES_PASSWORD: ${DB_PASSWORD:-panol123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panol"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache y Celery
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-cambiar_en_produccion}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt_cambiar_en_produccion}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./backend/app/static/uploads:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  # Celery worker para tareas asíncronas
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend

  # Celery beat — dispara las tareas periódicas (ver beat_schedule en celery_app.py)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - celery_worker

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/app/static:/var/www/static:ro
    depends_on:
      - backend

  # Portainer — administración visual de Docker (para usuarios sin conocimientos técnicos)
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  redis_data:
  portainer_data:
