version: '3.9'

services:
  # Base de datos PostgreSQL 16
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: panol_db
      POSTGRES_USER: panol
      POSTGRES_PASSWORD: ${DB_PASSWORD:-panol123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Puerto NO expuesto al exterior: el backend lo alcanza por la red interna
    # de Docker ("db:5432"). Exponerlo a 0.0.0.0 permite ataques de fuerza
    # bruta directos a la base de datos desde internet.
    expose:
      - "5432"
    healthcheck:
      # Se agrega -d panol_db: sin esa bandera pg_isready intenta conectarse
      # a una BD con el mismo nombre del usuario ("panol"), que no existe —
      # genera FATAL en los logs de Postgres aunque no bloquee el arranque.
      test: ["CMD-SHELL", "pg_isready -U panol -d panol_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis para cache y Celery
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    # Puerto NO expuesto al exterior: solo backend y Celery lo necesitan
    # internamente. Redis sin autenticación expuesto a internet es una
    # vulnerabilidad crítica (escritura arbitraria en caché/sesiones).
    expose:
      - "6379"

  # FastAPI backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-cambiar_en_produccion}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt_cambiar_en_produccion}
      DEBUG: ${DEBUG:-false}
    volumes:
      - ./backend/app/static/uploads:/app/app/static/uploads
      # Respaldos generados/restaurados desde la web (Administración →
      # Respaldo) — quedan visibles en el host, no solo dentro del
      # contenedor, igual que scripts/backup.sh.
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Puerto 8000 solo accesible desde la red interna Docker.
    # Nginx hace de proxy; no hay razón para exponerlo a internet.
    expose:
      - "8000"

  # Celery worker para tareas asíncronas
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker --loglevel=info
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend

  # Celery beat — dispara las tareas periódicas (ver beat_schedule en celery_app.py)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://panol:${DB_PASSWORD:-panol123}@db:5432/panol_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
      - celery_worker

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/app/static:/var/www/static:ro
      # Certificados SSL de Let's Encrypt (se llenan con certbot en el host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Webroot para renovación automática de certificados
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend

  # Portainer — administración visual de Docker (para usuarios sin conocimientos técnicos)
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    # --no-setup-token: deshabilita el token de configuración inicial.
    # Solo recomendado en redes privadas controladas (que es nuestro caso:
    # el puerto 9000 solo es accesible vía túnel SSH desde localhost).
    command: --no-setup-token
    ports:
      # Solo accesible desde localhost: para usar Portainer hay que abrir
      # un túnel SSH primero (ssh -L 9000:localhost:9000 ubuntu@servidor).
      # Exponerlo a 0.0.0.0 sin HTTPS es un panel de control sin protección.
      - "127.0.0.1:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  redis_data:
  portainer_data:
