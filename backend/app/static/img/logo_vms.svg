<svg width="175" height="44" viewBox="0 0 175 44" xmlns="http://www.w3.org/2000/svg">
  <!-- Hexágono (icónico en ingeniería: pernos, tuercas, estructuras) -->
  <polygon points="22,2 39,11.5 39,32.5 22,42 5,32.5 5,11.5" fill="#1d4ed8"/>
  <!-- Hexágono interior naranja (detalle industrial) -->
  <polygon points="22,8.5 33.5,15 33.5,29 22,35.5 10.5,29 10.5,15" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Letras VMS en blanco -->
  <text x="22" y="28" text-anchor="middle"
        font-family="Inter, Arial, sans-serif"
        font-size="13.5" font-weight="800" fill="white" letter-spacing="-0.5">VMS</text>

  <!-- Línea separadora sutil -->
  <rect x="49" y="8" width="1.5" height="28" rx="0.75" fill="#cbd5e1"/>

  <!-- Nombre empresa — dos líneas -->
  <text x="59" y="20"
        font-family="Inter, Arial, sans-serif"
        font-size="19" font-weight="800" fill="#1e3a5f">VMS</text>
  <text x="59" y="36"
        font-family="Inter, Arial, sans-serif"
        font-size="11" font-weight="500" fill="#64748b" letter-spacing="0.06em">INGENIERÍA</text>
</svg>
