<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Iniciar sesión — Sistema de Gestión de Herramientas">
<title>Iniciar sesión · {{ brand.company_name if brand else "Pañol v2.0" }}</title>

<meta name="theme-color" content="{{ brand.primary_color if brand else '#4f46e5' }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

<style>
{{ brand_css | safe }}

*, *::before, *::after { box-sizing: border-box; }

body {
  font-family: var(--brand-font-body, 'Inter', sans-serif);
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--brand-dark, #1e1b4b) 0%, var(--brand-primary, #4f46e5) 100%);
  padding: 1.5rem;
}

.login-card {
  width: 100%;
  max-width: 400px;
  background: #fff;
  border-radius: var(--brand-radius, 8px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  padding: 2.25rem 2rem;
}

.login-logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.75rem;
  text-align: center;
}

.login-logo img { height: 48px; max-width: 220px; object-fit: contain; }

.login-logo h1 {
  font-size: 1.1rem;
  font-weight: 700;
  color: #1e293b;
  margin: 0;
  font-family: var(--brand-font-heading, 'Inter', sans-serif);
}

.login-logo p { font-size: 0.8rem; color: #64748b; margin: 0; }

.field { margin-bottom: 1.1rem; }

.field label {
  display: block;
  font-size: 0.8rem;
  font-weight: 500;
  color: #334155;
  margin-bottom: 0.35rem;
}

.field input {
  width: 100%;
  border: 1px solid #cbd5e1;
  border-radius: calc(var(--brand-radius, 8px) - 2px);
  padding: 0.6rem 0.75rem;
  font-size: 0.9rem;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field input:focus {
  border-color: var(--brand-primary, #4f46e5);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-primary, #4f46e5) 20%, transparent);
}

.login-btn {
  width: 100%;
  background: var(--brand-primary, #4f46e5);
  color: var(--brand-text-on-primary, #fff);
  border: none;
  border-radius: var(--brand-radius, 8px);
  padding: 0.7rem;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: filter 0.15s, transform 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.login-btn:hover:not(:disabled) { filter: brightness(0.92); transform: translateY(-1px); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

.alert-error {
  background: #fee2e2;
  color: #991b1b;
  border-radius: calc(var(--brand-radius, 8px) - 2px);
  padding: 0.6rem 0.75rem;
  font-size: 0.8rem;
  margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.5rem;
}

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.footer-note { text-align: center; font-size: 0.72rem; color: #94a3b8; margin-top: 1.5rem; }
</style>
</head>
<body>

<div class="login-card" x-data="loginForm()">

  <div class="login-logo">
    {% if brand and brand.logo_url %}
    <img src="{{ brand.logo_url }}" alt="{{ brand.company_name }}">
    {% else %}
    <svg width="48" height="48" viewBox="0 0 36 36" fill="none">
      <rect width="36" height="36" rx="8" fill="var(--brand-primary, #4f46e5)"/>
      <path d="M10 18h16M18 10v16" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    {% endif %}
    <h1>{{ brand.company_name if brand else "Pañol v2.0" }}</h1>
    <p>Ingresá con tu email y contraseña para continuar</p>
  </div>

  <template x-if="errorMessage">
    <div class="alert-error">
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" style="flex-shrink:0;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      <span x-text="errorMessage"></span>
    </div>
  </template>

  <form @submit.prevent="submit()">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" x-model="email" autocomplete="username" required placeholder="tu@empresa.com">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" name="password" x-model="password" autocomplete="current-password" required placeholder="••••••••">
    </div>

    <button type="submit" class="login-btn" :disabled="loading">
      <template x-if="loading"><span class="spinner"></span></template>
      <span x-text="loading ? 'Ingresando...' : 'Iniciar sesión'"></span>
    </button>
  </form>

  <p class="footer-note">Sistema de Gestión de Herramientas · {{ brand.company_name if brand else "Pañol v2.0" }}</p>
</div>

<script>
function loginForm() {
  return {
    email: '',
    password: '',
    loading: false,
    errorMessage: '',

    async submit() {
      this.loading = true;
      this.errorMessage = '';

      try {
        const body = new URLSearchParams();
        body.append('username', this.email);
        body.append('password', this.password);

        const res = await fetch('/api/v1/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: body.toString(),
        });

        const data = await res.json();

        if (!res.ok) {
          this.errorMessage = data.detail || 'No se pudo iniciar sesión';
          return;
        }

        localStorage.setItem('panol-access-token', data.access_token);
        localStorage.setItem('panol-refresh-token', data.refresh_token);
        window.location.href = '/';
      } catch (e) {
        this.errorMessage = 'Error de conexión con el servidor';
      } finally {
        this.loading = false;
      }
    }
  }
}
</script>

</body>
</html>
