<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pañol 360 · Acceso empresarial</title>
<meta name="description" content="Sistema de Gestión de Herramientas — Ingresa el alias de tu empresa">
<link rel="icon" href="/static/img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --p-primary:   #4f46e5;
  --p-dark:      #1e1b4b;
  --p-accent:    #06b6d4;
  --p-radius:    12px;
}

body {
  font-family: 'Inter', sans-serif;
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, var(--p-dark) 0%, var(--p-primary) 60%, var(--p-accent) 100%);
  padding: 1.5rem;
}

/* Fondo con patrón sutil */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: radial-gradient(circle at 25% 25%, rgba(255,255,255,0.04) 1px, transparent 1px),
                    radial-gradient(circle at 75% 75%, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.card {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border-radius: var(--p-radius);
  box-shadow: 0 25px 60px rgba(0,0,0,0.3);
  padding: 2.5rem 2.25rem;
  position: relative;
}

/* Logo / identidad de la plataforma */
.brand-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 2rem;
  text-align: center;
}

.brand-icon {
  width: 56px; height: 56px;
  background: var(--p-primary);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 20px rgba(79,70,229,0.35);
}

.brand-name {
  font-size: 1.5rem;
  font-weight: 800;
  color: #1e293b;
  letter-spacing: -0.5px;
  margin: 0;
}

.brand-tagline {
  font-size: 0.82rem;
  color: #64748b;
  margin: 0;
}

/* Separador */
.divider {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 1.5rem;
  color: #94a3b8;
  font-size: 0.78rem;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e2e8f0;
}

/* Campo alias */
.field-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: #334155;
  margin-bottom: 0.4rem;
}

.alias-wrapper {
  display: flex;
  align-items: center;
  border: 2px solid #e2e8f0;
  border-radius: calc(var(--p-radius) - 2px);
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
  margin-bottom: 1.25rem;
}

.alias-wrapper:focus-within {
  border-color: var(--p-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,0.15);
}

.alias-wrapper.error {
  border-color: #ef4444;
  box-shadow: 0 0 0 3px rgba(239,68,68,0.12);
}

.alias-input {
  flex: 1;
  border: none;
  outline: none;
  padding: 0.7rem 0.85rem;
  font-size: 0.95rem;
  font-family: 'Inter', sans-serif;
  color: #1e293b;
  background: transparent;
}

.alias-input::placeholder { color: #94a3b8; }

/* Botón */
.btn-enter {
  width: 100%;
  background: var(--p-primary);
  color: #fff;
  border: none;
  border-radius: calc(var(--p-radius) - 2px);
  padding: 0.75rem;
  font-size: 0.95rem;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  transition: filter 0.15s, transform 0.1s;
}

.btn-enter:hover { filter: brightness(0.92); transform: translateY(-1px); }
.btn-enter:active { transform: translateY(0); }

/* Error */
.alert-error {
  background: #fef2f2;
  color: #b91c1c;
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 0.65rem 0.85rem;
  font-size: 0.82rem;
  margin-bottom: 1rem;
  display: flex; align-items: center; gap: 0.5rem;
}

/* Ayuda */
.help-text {
  text-align: center;
  font-size: 0.76rem;
  color: #94a3b8;
  margin-top: 1.5rem;
  line-height: 1.5;
}

/* Footer plataforma */
.platform-footer {
  position: absolute;
  bottom: -2.5rem;
  left: 0; right: 0;
  text-align: center;
  font-size: 0.72rem;
  color: rgba(255,255,255,0.55);
}
</style>
</head>
<body>

<div class="card">

  <!-- Identidad Pañol 360 -->
  <div class="brand-header">
    <div class="brand-icon">
      <svg width="30" height="30" viewBox="0 0 36 36" fill="none">
        <path d="M8 18h20M18 8v20" stroke="white" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="18" cy="18" r="7" stroke="white" stroke-width="2.2" fill="none"/>
      </svg>
    </div>
    <h1 class="brand-name">Pañol 360</h1>
    <p class="brand-tagline">Sistema de Gestión de Herramientas</p>
  </div>

  <div class="divider">Ingresa a tu empresa</div>

  <!-- Error de alias no encontrado -->
  {% if error %}
  <div class="alert-error">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <!-- Formulario de alias -->
  <form method="post" action="/portal/verify">
    <label class="field-label" for="alias">Alias de tu empresa</label>
    <div class="alias-wrapper {% if error %}error{% endif %}">
      <input
        class="alias-input"
        type="text"
        id="alias"
        name="alias"
        value="{{ alias or '' }}"
        placeholder="ej: vms-ingenieria"
        autocomplete="organization"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"
        autofocus
        required
      >
    </div>

    <button type="submit" class="btn-enter">
      Continuar
      <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
      </svg>
    </button>
  </form>

  <p class="help-text">
    ¿No recordás el alias de tu empresa?<br>
    Contactá al administrador de tu organización.
  </p>

  <div class="platform-footer">panol360.app · © 2025 Valentín Morales</div>
</div>

</body>
</html>
