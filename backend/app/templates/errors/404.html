{% extends "base.html" %}
{% block title %}Página no encontrada{% endblock %}

{% block content %}
<div style="
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  text-align: center;
  padding: 2rem;
  gap: 1.5rem;
">

  <!-- Ilustración SVG -->
  <svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- Caja de herramientas abierta -->
    <rect x="20" y="70" width="120" height="72" rx="8" fill="var(--brand-primary, #4f46e5)" opacity="0.12"/>
    <rect x="20" y="70" width="120" height="72" rx="8" stroke="var(--brand-primary, #4f46e5)" stroke-width="3" fill="none"/>
    <!-- Tapa de la caja -->
    <path d="M20 82 Q80 42 140 82" stroke="var(--brand-primary, #4f46e5)" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Asas de la caja -->
    <rect x="60" y="60" width="40" height="14" rx="7" fill="var(--brand-primary, #4f46e5)" opacity="0.25"/>
    <rect x="60" y="60" width="40" height="14" rx="7" stroke="var(--brand-primary, #4f46e5)" stroke-width="2.5" fill="none"/>
    <!-- Herramientas que salen de la caja (llave inglesa) -->
    <path d="M72 70 L72 48 M72 48 Q72 40 80 40 Q88 40 88 48 Q88 54 82 56 L82 70" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Destornillador -->
    <line x1="100" y1="70" x2="100" y2="44" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <rect x="96" y="40" width="8" height="6" rx="1" fill="#64748b"/>
    <!-- Signo de pregunta grande -->
    <text x="80" y="122" text-anchor="middle" font-size="32" font-weight="700" fill="var(--brand-primary, #4f46e5)" opacity="0.7" font-family="Inter, sans-serif">?</text>
  </svg>

  <!-- Código de error -->
  <div style="
    font-size: 5rem;
    font-weight: 800;
    line-height: 1;
    color: var(--brand-primary, #4f46e5);
    opacity: 0.15;
    letter-spacing: -0.05em;
    margin-bottom: -1rem;
  ">404</div>

  <!-- Título -->
  <h1 style="
    font-size: 1.5rem;
    font-weight: 700;
    color: #1e293b;
    margin: 0;
  ">Página no encontrada</h1>

  <!-- Descripción -->
  <p style="
    font-size: 0.95rem;
    color: #64748b;
    max-width: 380px;
    margin: 0;
    line-height: 1.6;
  ">
    La herramienta que buscas no está en el pañol.<br>
    Es posible que la URL haya cambiado o que no exista.
  </p>

  <!-- Acciones -->
  <div style="display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; margin-top: 0.5rem;">
    <a href="/" style="
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: var(--brand-primary, #4f46e5);
      color: var(--brand-text-on-primary, #fff);
      padding: 0.625rem 1.25rem;
      border-radius: var(--brand-radius, 8px);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 600;
      transition: opacity 0.15s;
    " onmouseover="this.style.opacity='0.88'" onmouseout="this.style.opacity='1'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Ir al inicio
    </a>
    <button onclick="history.back()" style="
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: #f1f5f9;
      color: #475569;
      padding: 0.625rem 1.25rem;
      border-radius: var(--brand-radius, 8px);
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      transition: background 0.15s;
    " onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='#f1f5f9'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Volver atrás
    </button>
  </div>

</div>
{% endblock %}
