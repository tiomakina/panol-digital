{% extends "base.html" %}

{% block content %}
<style>
  .login-wrap {
    min-height: calc(100vh - 2rem);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    width: 100%;
    max-width: 360px;
  }
  .login-logo {
    text-align: center;
    margin-bottom: 2rem;
  }
  .login-logo h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: .25rem;
  }
  .login-logo p {
    font-size: .875rem;
    color: var(--text3);
  }
  .error-msg {
    background: rgba(239,68,68,.1);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: var(--radius);
    color: var(--red);
    padding: .6rem .75rem;
    font-size: .875rem;
    margin-bottom: 1rem;
  }
  .login-footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: .75rem;
    color: var(--text3);
  }
  .lock-icon {
    font-size: 2.5rem;
    display: block;
    margin-bottom: .5rem;
  }
</style>

<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <span class="lock-icon">🔐</span>
      <h1>Pañol 360</h1>
      <p>Panel de administración — acceso privado</p>
    </div>

    <div class="card">
      {% if error %}
      <div class="error-msg">⚠️ {{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            required
            autofocus
          >
        </div>

        <div class="form-group" style="margin-bottom:1.5rem;">
          <label class="form-label" for="password">Contraseña</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">
          Ingresar →
        </button>
      </form>
    </div>

    <p class="login-footer">
      🔒 Conexión cifrada vía Tailscale VPN
    </p>
  </div>
</div>
{% endblock %}
