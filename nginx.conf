server {
    listen 80;
    server_name _;
    client_max_body_size 5M;

    # ── Headers de seguridad ──────────────────────────────────────────────
    # Evita que el navegador adivine el content-type del archivo servido.
    add_header X-Content-Type-Options  "nosniff"         always;
    # Impide que la app sea incrustada en un <iframe> externo (clickjacking).
    add_header X-Frame-Options         "SAMEORIGIN"       always;
    # Habilita el filtro XSS del navegador (legacy, pero inofensivo en modernos).
    add_header X-XSS-Protection        "1; mode=block"    always;
    # Controla qué información de Referer se envía a terceros.
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    # Restringe las características del navegador (cámara, micrófono, etc.)
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # Oculta la versión de Nginx al mundo exterior.
    server_tokens off;

    # ── Archivos estáticos ────────────────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
        # SVG podría ejecutar scripts si se incrusta como <img>; forzar
        # el tipo correcto impide que el navegador lo trate como HTML.
        types {
            image/svg+xml svg svgz;
        }
    }

    # ── Proxy al backend ──────────────────────────────────────────────────
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Protección básica ante ataques de timing en el proxy.
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
        proxy_connect_timeout 10s;
    }
}
