# ── HTTP: redirige a HTTPS y sirve desafíos ACME (renovación automática) ──────
server {
    listen 80;
    server_name demopanol.valentinmorales.cl;

    # Desafío ACME de Let's Encrypt (certbot webroot para renovaciones)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name demopanol.valentinmorales.cl;
    client_max_body_size 5M;

    # ── Certificados SSL (Let's Encrypt via certbot) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/demopanol.valentinmorales.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demopanol.valentinmorales.cl/privkey.pem;

    # Protocolos y cifrados seguros (TLS 1.2+ solamente)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ── Headers de seguridad ──────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                          always;
    add_header X-Frame-Options         "SAMEORIGIN"                        always;
    add_header X-XSS-Protection        "1; mode=block"                     always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # HSTS: fuerza HTTPS durante 1 año en el navegador del cliente
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # ── Archivos estáticos ────────────────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
        # IMPORTANTE: sin bloque types{} — reemplazaría los MIME types
        # globales y serviría .js como application/octet-stream.
    }

    # ── Proxy al backend ──────────────────────────────────────────────────
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
