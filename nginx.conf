# ══════════════════════════════════════════════════════════════════════════════
# Pañol 360 — Nginx Reverse Proxy
# Dominios: panol360.app (producción) + demopanol.valentinmorales.cl (legado)
# ══════════════════════════════════════════════════════════════════════════════

# ── HTTP: desafío ACME + redirect HTTPS ────────────────────────────────────────
server {
    listen 80;
    server_name panol360.app www.panol360.app demopanol.valentinmorales.cl;

    # Let's Encrypt webroot challenge (renovaciones automáticas)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS (www redirige al apex)
    location / {
        return 301 https://panol360.app$request_uri;
    }
}

# ── HTTPS: dominio legado → redirige al nuevo ──────────────────────────────────
server {
    listen 443 ssl;
    server_name demopanol.valentinmorales.cl www.panol360.app;

    ssl_certificate     /etc/letsencrypt/live/demopanol.valentinmorales.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demopanol.valentinmorales.cl/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    server_tokens off;

    # Redirect permanente al dominio principal
    return 301 https://panol360.app$request_uri;
}

# ── HTTPS: panol360.app — servidor principal ───────────────────────────────────
server {
    listen 443 ssl;
    server_name panol360.app;
    client_max_body_size 5M;

    # Certificados SSL (Let's Encrypt via certbot)
    # ATENCIÓN: cambiar a /live/panol360.app/ después de correr certbot
    ssl_certificate     /etc/letsencrypt/live/panol360.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panol360.app/privkey.pem;

    # TLS hardening
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ── Headers de seguridad ───────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;
    # HSTS: fuerza HTTPS 2 años. Obligatorio para .app (preload list)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    server_tokens off;

    # ── Archivos estáticos ─────────────────────────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # ── Proxy al backend FastAPI ───────────────────────────────────────────────
    location / {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Client-Alias    "";  # reservado para multi-tenant

        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
        proxy_connect_timeout 10s;
    }
}
